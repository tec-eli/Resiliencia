name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate aggregated Javadoc
        run: |
          mvn -B -pl '!resiliencia-stress,!resiliencia-examples' \
            org.apache.maven.plugins:maven-javadoc-plugin:3.10.1:aggregate \
            -Dstylesheetfile="${{ github.workspace }}/web/resiliencia-javadoc.css"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp -r target/reports/apidocs _site/apidocs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
